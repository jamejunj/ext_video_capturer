<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <header class="vc-header">
            <img class="vc-logo" src="../images/icon-48.png" alt="">
            <div class="vc-title">
                <h1>Video Capturer</h1>
                <p>Capture frames from HTML5 videos</p>
            </div>
        </header>

        <main class="vc-preview">
            <div class="vc-status">
                <span class="vc-status-dot"></span>
                <em class="vc-message"></em>
            </div>
            <div class="vc-preview-container"></div>
            <div class="vc-empty">
                <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                        d="M15 10l4.55-2.28A1 1 0 0121 8.62v6.76a1 1 0 01-1.45.9L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2zM3 3l18 18"/>
                </svg>
                <p>Open a page with a playing video, then click the extension again.</p>
            </div>
        </main>

        <footer class="vc-license">
            Video Image Capturer 2022-2024 &copy; All Right Reserved.
        </footer>
        <script src="popup.js"></script>
    </body>
</html>
