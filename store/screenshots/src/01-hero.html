<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
    body { width: 1280px; height: 800px; display: flex; align-items: center; padding: 0 80px; gap: 64px; }
    .copy { flex: 1; display: flex; flex-direction: column; gap: 28px; }
    h1 { font-size: 58px; }
    .lead { font-size: 20px; max-width: 520px; }
    .popup { flex: none; transform: scale(1.12); transform-origin: center; }
</style></head>
<body>
    <div class="copy">
        <div class="brand"><img src="icon.png" alt="">Video Capturer</div>
        <h1>Grab any video frame in <em>full resolution</em></h1>
        <p class="lead">One click captures the exact frame you're watching from every HTML5 video on the page as a crisp PNG.</p>
        <div class="chips">
            <span class="chip"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/></svg>Native resolution</span>
            <span class="chip"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 9h10a1 1 0 011 1v10a1 1 0 01-1 1H9a1 1 0 01-1-1V10a1 1 0 011-1zM16 9V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>Copy to clipboard</span>
            <span class="chip"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>Save as PNG</span>
        </div>
    </div>
    <div class="popup"></div>
</body></html>
